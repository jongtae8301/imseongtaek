name: Import initial InfoScope source

on:
  push:
    paths: ['.github/workflows/import.yml']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify and expand reviewed source
        run: |
          echo '4cb3c95784893cf8320e7207e07f4b00b170f185df849522e598aeaf2070c35f  infoscope-source.tar.gz' | sha256sum --check
          tar -xzf infoscope-source.tar.gz
          git rm infoscope-source.tar.gz
          git add .editorconfig .gitignore .prettierignore .prettierrc.json AGENTS.md DESIGN.md README.md index.html package.json pnpm-lock.yaml playwright.config.ts tsconfig.json vite.config.ts src public docs tests
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Initialize InfoScope application source'
          git push origin HEAD:master
